<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Pessoal | Joana Gonçalves</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Joana Gonçalves</div>
        <div class="header-text">Descrição curta do meu trabalho.</div>
    </header>
    <main>
        <section class="hero-image">
            <img src="https://via.placeholder.com/400x600" alt="Imagem de destaque">
        </section>
        <section class="hero-text">
            <h1>Developer & Designer</h1>
        </section>
        <section class="about-me">
            <h2>Sobre Mim</h2>
            <p>Texto descritivo sobre a minha trajetória profissional e pessoal.</p>
        </section>
        <section class="projects">
            <h2>Projetos</h2>
            <div class="project">
                <img src="https://via.placeholder.com/300x200" alt="Projeto 1">
                <p>Descrição do Projeto 1.</p>
            </div>
            <div class="project">
                <img src="https://via.placeholder.com/300x200" alt="Projeto 2">
                <p>Descrição do Projeto 2.</p>
            </div>
        </section>
    </main>
    <footer>
        <p>Joana Gonçalves &copy; 2026</p>
    </footer>
</body>
</html>
